name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 旧版 tools 包已从 SDK 仓库移除，避免 sdkmanager 找不到包
          packages: 'platform-tools'

      - name: Install Android SDK platforms and build-tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 本地 wrapper 指向腾讯镜像（国内更快）；CI 是海外机器，切回 Gradle 官方分发地址
      - name: Use official Gradle distribution in CI
        run: |
          sed -i -E 's#^distributionUrl=.*gradle-([0-9][0-9.]*)-bin.zip#distributionUrl=https\://services.gradle.org/distributions/gradle-\1-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug :notiftest:assembleDebug --stacktrace

      - name: Upload TapDock APK
        uses: actions/upload-artifact@v4
        with:
          name: TapDock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload notiftest APK
        uses: actions/upload-artifact@v4
        with:
          name: notiftest-debug
          path: notiftest/build/outputs/apk/debug/notiftest-debug.apk
          if-no-files-found: error
          retention-days: 14
