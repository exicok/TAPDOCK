plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lsp102.notiftest'
    compileSdk 35

    defaultConfig {
        applicationId "com.lsp102.notiftest"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// 故意零 AndroidX 依赖：只用平台 API，离线也能秒编
dependencies {
}
